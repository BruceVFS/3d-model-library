[package]
name = "model-library"
version = "0.1.1"
description = "Modelarium local-first 3D printing model catalogue"
authors = ["BruceVFS"]
edition = "2021"

[lib]
name = "model_library_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
